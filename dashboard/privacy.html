            오늘의 커뮤니티는 공개 페이지 이용 과정에서 이용자의 개인정보를 직접 수집하거나

          </p>

          <p>
            현재 광고는 게재하지 않습니다. 향후 광고가 게재되는 경우에는 광고 제공 과정에서
            쿠키 등이 사용될 수 있으며, 광고가 게재되지 않는 경우에는 해당하지 않습니다.
            광고를 도입할 때 실제 처리 내용을 이 방침에 반영합니다.
          </p>
        </section>

        <p class="policy-date">시행일: 2026년 8월 25일</p>
