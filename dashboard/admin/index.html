<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'self'"
    />
    <title>TodayCommunity 관리자</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="login-panel" id="login-panel" aria-label="관리자 로그인">
        <a class="button button-secondary back-link" href="/">돌아가기</a>
        <form id="login-form" aria-label="관리자 로그인">
          <label class="visually-hidden" for="admin-password">비밀번호</label>
          <input
            id="admin-password"
            name="password"
            type="password"
            minlength="16"
            maxlength="200"
            placeholder="비밀번호"
            autocomplete="current-password"
            aria-describedby="login-status"
            required
          />
          <button class="button button-primary" type="submit">로그인</button>
        </form>
        <p class="status" id="login-status" role="status" aria-live="polite"></p>
      </section>

      <section class="management" id="management-panel" aria-labelledby="management-title" hidden>
        <div class="management-heading">
          <div>
            <h1 id="management-title">시크릿 링크</h1>
            <p>링크 소지자는 authenticated 권한만 가지며 이 관리 화면에는 접근할 수 없습니다.</p>
          </div>
          <div class="management-actions">
            <a class="button button-secondary" href="/">돌아가기</a>
            <button class="button button-secondary" id="logout-button" type="button">로그아웃</button>
          </div>
        </div>

        <section class="panel" aria-labelledby="create-title">
          <h3 id="create-title">새 링크 발급</h3>
          <form class="create-form" id="create-form">
            <label class="label-field">
              <span>링크 이름</span>
              <input
                id="link-label"
                name="label"
                type="text"
                maxlength="80"
                placeholder="예: 집 PC"
                autocomplete="off"
                required
              />
            </label>
            <label>
              <span>만료</span>
              <select id="link-expiry" name="expires_in_days">
                <option value="0" selected>직접 폐기할 때까지</option>
                <option value="30">30일</option>
                <option value="90">90일</option>
                <option value="365">1년</option>
              </select>
            </label>
            <button class="button button-primary" type="submit">시크릿 링크 생성</button>
          </form>
          <p class="status" id="create-status" role="status" aria-live="polite"></p>

          <div class="secret-result" id="secret-result" hidden>
            <strong>새 시크릿 링크</strong>
            <p>이 주소는 지금 한 번만 표시됩니다. 안전한 북마크나 암호 관리자에 저장하세요.</p>
            <div class="secret-copy-row">
              <input id="secret-url" type="text" readonly aria-label="새 시크릿 링크" />
              <button class="button button-secondary" id="copy-button" type="button">복사</button>
            </div>
          </div>
        </section>

        <section class="panel" aria-labelledby="links-title">
          <div class="links-heading">
            <h3 id="links-title">발급된 링크</h3>
            <button class="button button-secondary" id="refresh-button" type="button">새로고침</button>
          </div>
          <p class="status" id="links-status" role="status" aria-live="polite"></p>
          <div class="link-list" id="link-list"></div>
        </section>
      </section>
    </main>

    <script src="/admin/admin.js"></script>
  </body>
</html>
